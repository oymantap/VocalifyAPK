<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Terputus</title>
    <style>
        :root {
            --bg-color: #0f0c29;
            --accent-purple: #6a11cb;
            --light-purple: #9b59b6;
            --text-color: #f1f1f1;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2.5rem;
            max-width: 400px;
            width: 85%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        .icon-box {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: inline-block;
            filter: drop-shadow(0 0 10px var(--light-purple));
        }

        h2 {
            margin: 0.5rem 0;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, var(--light-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1rem;
            opacity: 0.8;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(45deg, var(--accent-purple), var(--light-purple));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(106, 17, 203, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(106, 17, 203, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Mobile */
        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.5rem;
            }
            h2 { font-size: 1.5rem; }
            p { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">🌐</div>
        <h2>Koneksi Terputus</h2>
        <p>Cek kuota atau Wi-Fi kamu sebentar, lalu coba akses kembali halaman ini.</p>
        <button class="btn" onclick="location.reload()">Coba Lagi</button>
    </div>

</body>
  </html>
